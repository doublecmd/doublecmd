name: build-release

on:
  workflow_dispatch:
  release:
    types: [prereleased, released]

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-mac:
    runs-on: macos-15
    steps:
    - name: Restore fpc from cache
      id: fpc-restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ runner.temp }}/fpc-dmg
        key: ${{ runner.os }}-fpc

    - name: Download fpc from site
      if: steps.fpc-restore.outputs.cache-hit != 'true'
      run: |
            curl -L -o "${{ runner.temp }}/fpc.dmg" \
              https://github.com/doublecmd/fpc-3.2.x/releases/download/v3.2.4-rc2/fpc-3.2.4-rc2-aarch64-macosx.dmg
            hdiutil attach "${{ runner.temp }}/fpc.dmg" -mountpoint "${{ runner.temp }}/fpc-dmg"

    - name: Save fpc to cache
      if: steps.fpc-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ runner.temp }}/fpc-dmg
        key: ${{ runner.os }}-fpc

    - name: Install Free Pascal
      run: |
           sudo installer -pkg "${{ runner.temp }}/fpc-dmg/fpc-3.2.4-rc2-aarch64-macosx.pkg" -target /
           sudo fpcmkcfg -d "basepath=/usr/local/lib/fpc/3.2.4" -o /etc/fpc.cfg

    - name: Get Lazarus source
      uses: actions/checkout@v7
      with:
            repository: 'fpc/Lazarus'
            ref: 'fixes_4'

    - name: Build and install Lazarus
      run: |
           make all
           sudo make install

    - name: Create Lazarus config
      run: |
           sudo mkdir -p /etc/lazarus
           sudo cp tools/install/macosx/environmentoptions.xml /etc/lazarus/environmentoptions.xml
           sudo sed -i -e "s|_PPCARCH_|fpc|g; s|/Developer/lazarus|/usr/local/share/lazarus|g" /etc/lazarus/environmentoptions.xml

    - name: Checkout source
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Prepare source
      run: sed -i -e "s|BOX_CLIENT_SECRET = '\*'|BOX_CLIENT_SECRET = '$BOX_CLIENT_SECRET'|g" plugins/wfx/MacCloud/src/drivers/oauth2/box/uboxclient.pas
      env:
        BOX_CLIENT_SECRET: ${{ secrets.BOX_CLIENT_SECRET }}

    - name: Download unrar source code
      run: wget https://www.rarlab.com/rar/unrarsrc-7.2.7.tar.gz -O /tmp/unrarsrc.tar.gz
      
    - name: Extract unrar source code
      run: cd /tmp && tar xzf unrarsrc.tar.gz

    - name: Build packages
      run: ./.github/scripts/create_release.sh

    - name: Upload binaries to release
      uses: svenstaro/upload-release-action@v2
      with:
        file: doublecmd-release/doublecmd*.dmg
        tag: ${{ github.ref }}
        overwrite: true
        file_glob: true

  publish-bin:
    needs: build-mac
    runs-on: ubuntu-latest
    steps:
      - name: Download release
        run: |
             gh release download $TAG -R doublecmd/doublecmd -D doublecmd-release
             rm -f doublecmd-release/doublecmd-*-src.tar.gz
        env:
          TAG: ${{ github.ref_name }}

      - name: Publish release
        run: |
             trap "rm -f ssh_key" EXIT
             echo "$SSH_PRIVATE_KEY" > ssh_key && chmod 0600 ssh_key
             echo "cd '/home/frs/project/doublecmd/Double Commander'" > upload_release.txt
             echo "lcd doublecmd-release" >> upload_release.txt
             echo "-mkdir $TAG" >> upload_release.txt
             echo "cd $TAG" >> upload_release.txt
             echo "put *" >> upload_release.txt
             echo "quit" >> upload_release.txt
             sftp -o StrictHostKeyChecking=no -i ssh_key -b upload_release.txt $REMOTE_USER@$REMOTE_HOST
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          TAG: ${{ github.ref_name }}
